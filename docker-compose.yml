services:
  tsm-hub:
    build: .
    image: tsm-hub:latest
    container_name: tsm-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:19070:9070"  # 仅本机回环可访问（外部端口 >10000），容器内仍监听 9070
    volumes:
      - ./data:/data
      # 技能库（gitmodules 子模块）只读挂载进容器，供技能注入/执行使用
      - ./skills:/skills:ro
    environment:
      # 生产环境务必改成强口令；未设置时回落到 config.json 里的 admin_token。
      # 如果想复用挂载的 ./data/config.json 中的 admin_token，注释掉下面这行即可
      # TSM_HUB_ADMIN_TOKEN: change-me-admin
      TSM_HUB_LOG_LEVEL: info
      # 智能路由策略（可选）：cost_first / stability_first / task_aware / balanced
      # TSM_HUB_SMART_STRATEGY: stability_first
      # TSM_HUB_SMART_COST_WEIGHT: 40
      # TSM_HUB_SMART_STABILITY_WEIGHT: 100
      # TSM_HUB_SMART_LATENCY_WEIGHT: 60
      # A2A / Peer 接入 lume 集群（tsm-hub 作为只读能力节点）。
      # TSM_HUB_PEER_ROOT 用 ${} 从同目录 .env（gitignore）插值，密钥不入 compose 文件。
      # 未设 TSM_HUB_PEER_ROOT 时容器 peer 签名面 fail-closed（不影响 A2A 公开发现面）。
      # 注册表缺省读 /data/peers-identity.json（= ./data/peers-identity.json，已挂载）。
      TSM_HUB_PEER_NAME: tsm-hub
      TSM_HUB_PEER_ROOT: ${TSM_HUB_PEER_ROOT}
      TSM_HUB_PEER_SKEW: "120"
      # 上游 provider API keys。config.json 里全部是 "env:TSM_HUB_KEY_*" 引用
      # （密钥不落 config.json），这里 ${} 从同目录 .env（gitignore）插值注入容器。
      # compose 只注入显式列出的变量，.env 里的其它值（WORKSPACE 等）不会进容器。
      # 新增 provider 三步：config.json 写 env: 引用 → .env 补同名键 → 这里加一行；
      # make privacy-check 会拒绝任何明文 api_key 漏进 config.json / 历史备份。
      TSM_HUB_KEY_KIMI: ${TSM_HUB_KEY_KIMI}
      TSM_HUB_KEY_AGNES: ${TSM_HUB_KEY_AGNES}
      TSM_HUB_KEY_DEEPSEEK: ${TSM_HUB_KEY_DEEPSEEK}
      TSM_HUB_KEY_SENSENOVA: ${TSM_HUB_KEY_SENSENOVA}
      TSM_HUB_KEY_TOKENROUTER: ${TSM_HUB_KEY_TOKENROUTER}
      TSM_HUB_KEY_OPENROUTER: ${TSM_HUB_KEY_OPENROUTER}
      TSM_HUB_KEY_ALIBAILIAN: ${TSM_HUB_KEY_ALIBAILIAN}
      TSM_HUB_KEY_BAI: ${TSM_HUB_KEY_BAI}
      TSM_HUB_KEY_GEMINI: ${TSM_HUB_KEY_GEMINI}
      TSM_HUB_KEY_GLM: ${TSM_HUB_KEY_GLM}
      TSM_HUB_KEY_SILICONFLOW: ${TSM_HUB_KEY_SILICONFLOW}
      TSM_HUB_KEY_NVIDIA: ${TSM_HUB_KEY_NVIDIA}
      TSM_HUB_KEY_GROQ: ${TSM_HUB_KEY_GROQ}
      TSM_HUB_KEY_MODELSCOPE: ${TSM_HUB_KEY_MODELSCOPE}
      TSM_HUB_KEY_TEAMOROUTER: ${TSM_HUB_KEY_TEAMOROUTER}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9070/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # MCP stdio -> Streamable HTTP 网关（deploy/mcp-gateway.Dockerfile，自研 C 版，
  # 已替代 supergateway；mcp-git 用 deploy/mcp-gateway-git.Dockerfile）。
  # tsm-hub 容器无 node/宿主路径，stdio 型 MCP 无法本地 spawn；改为把官方 stdio
  # server 包成 HTTP，tsm-hub config 里用 transport=http + url 远程调用。
  # fs 服务把宿主工作区挂到容器内同路径（:rw），路径通过 WORKSPACE 环境变量注入
  #（见 .env.example），避免把绝对路径写死进仓库；host==container 保持一致。
  # 2026-11-09 由 :ro 改为 :rw：resolve-lume 的 agent 通过这座桥写文件（与 tsm-hub 共用
  # 同一容器，故 tsm-hub 侧也获得写权限）。
  mcp-fs:
    image: mcp-gateway:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway.Dockerfile
    container_name: mcp-fs
    environment:
      MCP_GW_MAX_SESSIONS: "${MCP_GW_MAX_SESSIONS:-4}"
      MCP_GW_IDLE_TTL_SEC: "${MCP_GW_IDLE_TTL_SEC:-600}"
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
      - ${WORKSPACE}:${WORKSPACE}:rw
    command: ["8000", "node /mcp/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js ${WORKSPACE}"]
    healthcheck:
      # node 镜像无 wget/curl; 用 node 起 TCP 连接探 8000(supergateway 监听)判存活。
      # 端口可达=healthy, 连不上(服务挂)→ error → exit 1 → unhealthy。
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-memory:
    image: mcp-gateway:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway.Dockerfile
    container_name: mcp-memory
    restart: unless-stopped
    environment:
      MEMORY_FILE_PATH: /memory/memory.json
      MCP_GW_MAX_SESSIONS: "${MCP_GW_MAX_SESSIONS:-4}"
      MCP_GW_IDLE_TTL_SEC: "${MCP_GW_IDLE_TTL_SEC:-600}"
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
      - mcp-memory-data:/memory
    command: ["8000", "node /mcp/node_modules/@modelcontextprotocol/server-memory/dist/index.js"]
    healthcheck:
      # node 镜像无 wget/curl; 用 node 起 TCP 连接探 8000(supergateway 监听)判存活。
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-think:
    image: mcp-gateway:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway.Dockerfile
    container_name: mcp-think
    environment:
      MCP_GW_MAX_SESSIONS: "${MCP_GW_MAX_SESSIONS:-4}"
      MCP_GW_IDLE_TTL_SEC: "${MCP_GW_IDLE_TTL_SEC:-600}"
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
    # mcp_gateway <port> <stdio-command>；端口固定 8000，健康检查保持不变。
    command: ["8000", "node /mcp/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js"]
    healthcheck:
      # node 镜像无 wget/curl; 用 node 起 TCP 连接探 8000(supergateway 监听)判存活。
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  # fetch / git 原在 resolve-lume 的 deploy/mcp-bridges.compose.yml（手工 docker run 演化而来）。
  # 2026-11-09 收归 tsm-hub：五个 mcp-* 统一在这里，tsm-hub 是常驻网关，宿主重启后
  # 一条 `docker compose up -d` 全恢复，不再需要去 lume 仓另跑一套 compose。
  # 依赖也从 resolve-lume 的 vendored 目录合并到本仓 ./mcp/node_modules（单份，省 ~85MB）。
  mcp-fetch:
    image: mcp-gateway:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway.Dockerfile
    container_name: mcp-fetch
    environment:
      MCP_GW_MAX_SESSIONS: "${MCP_GW_MAX_SESSIONS:-4}"
      MCP_GW_IDLE_TTL_SEC: "${MCP_GW_IDLE_TTL_SEC:-600}"
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
    command: ["8000", "node /mcp/node_modules/fetch-mcp-server.cjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-git:
    image: mcp-gateway-git:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway-git.Dockerfile
    container_name: mcp-git
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
      # git 要能 add/commit，必须 :rw；工作区路径由 tsm-hub/.env 的 WORKSPACE 注入。
      - ${WORKSPACE}:${WORKSPACE}:rw
    # 容器里没有 ~/.gitconfig，不显式给身份时 git_commit 直接报 Author identity unknown。
    environment:
      GIT_AUTHOR_NAME: Erishen
      GIT_AUTHOR_EMAIL: 3292057+erishen@users.noreply.github.com
      GIT_COMMITTER_NAME: Erishen
      GIT_COMMITTER_EMAIL: 3292057+erishen@users.noreply.github.com
      MCP_GW_MAX_SESSIONS: "${MCP_GW_MAX_SESSIONS:-4}"
      MCP_GW_IDLE_TTL_SEC: "${MCP_GW_IDLE_TTL_SEC:-600}"
    command: ["8000", "node /mcp/node_modules/@cyanheads/git-mcp-server/dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== 监控：Prometheus + Grafana =====
  # 网关本身即 exporter（GET /metrics，标准 Prometheus 0.0.4 文本格式、不鉴权）。
  # 三者同处 compose 默认网络，用容器 DNS 名 tsm-hub:9070 抓取；
  # 不要写 127.0.0.1:19070 —— 那是 Prometheus 容器自己的 loopback。
  # 也不要把 9070/19070 改绑 0.0.0.0：/metrics 不鉴权，会暴露 provider 名与请求量。
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: tsm-hub-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # 改完规则可 curl -X POST http://127.0.0.1:19090/-/reload 热加载
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.4.0
    container_name: tsm-hub-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:19091:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # ⚠️ 首次启动前请在 .env 设置 GRAFANA_ADMIN_PASSWORD（见 .env.example）。
      # 未设置时回落 admin/admin；端口只绑回环，切勿把 19091 改绑 0.0.0.0。
      # 该变量只在 grafana-data 卷首次初始化时生效；卷已存在后改 .env 不会改密码，
      # 需在 UI 改，或 docker compose exec grafana grafana cli admin reset-admin-password '<新口令>'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:19091/"
    volumes:
      # 只挂这两个子目录，保留镜像自带的 plugins/ 与 alerting/ 空目录。
      # 覆盖整个 provisioning/ 会让 Grafana 启动时刷 "no such file or directory" error。
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mcp-memory-data:
  prometheus-data:
  grafana-data:
