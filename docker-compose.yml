services:
  tsm-hub:
    build: .
    image: tsm-hub:latest
    container_name: tsm-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:19070:9070"  # 仅本机回环可访问（外部端口 >10000），容器内仍监听 9070
    volumes:
      - ./data:/data
      # 技能库（gitmodules 子模块）只读挂载进容器，供技能注入/执行使用
      - ./skills:/skills:ro
    environment:
      # 生产环境务必改成强口令；未设置时回落到 config.json 里的 admin_token。
      # 如果想复用挂载的 ./data/config.json 中的 admin_token，注释掉下面这行即可
      # TSM_HUB_ADMIN_TOKEN: change-me-admin
      TSM_HUB_LOG_LEVEL: info
      # 智能路由策略（可选）：cost_first / stability_first / task_aware / balanced
      # TSM_HUB_SMART_STRATEGY: stability_first
      # TSM_HUB_SMART_COST_WEIGHT: 40
      # TSM_HUB_SMART_STABILITY_WEIGHT: 100
      # TSM_HUB_SMART_LATENCY_WEIGHT: 60
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9070/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # MCP stdio -> Streamable HTTP 网关（deploy/mcp-gateway.Dockerfile，自研 C 版，
  # 已替代 supergateway；mcp-git 用 deploy/mcp-gateway-git.Dockerfile）。
  # tsm-hub 容器无 node/宿主路径，stdio 型 MCP 无法本地 spawn；改为把官方 stdio
  # server 包成 HTTP，tsm-hub config 里用 transport=http + url 远程调用。
  # fs 服务把宿主工作区挂到容器内同路径（:rw），路径通过 WORKSPACE 环境变量注入
  #（见 .env.example），避免把绝对路径写死进仓库；host==container 保持一致。
  # 2026-11-09 由 :ro 改为 :rw：resolve-lume 的 agent 通过这座桥写文件（与 tsm-hub 共用
  # 同一容器，故 tsm-hub 侧也获得写权限）。
  mcp-fs:
    image: mcp-gateway:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway.Dockerfile
    container_name: mcp-fs
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
      - ${WORKSPACE}:${WORKSPACE}:rw
    command: ["8000", "node /mcp/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js ${WORKSPACE}"]
    healthcheck:
      # node 镜像无 wget/curl; 用 node 起 TCP 连接探 8000(supergateway 监听)判存活。
      # 端口可达=healthy, 连不上(服务挂)→ error → exit 1 → unhealthy。
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-memory:
    image: mcp-gateway:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway.Dockerfile
    container_name: mcp-memory
    restart: unless-stopped
    environment:
      MEMORY_FILE_PATH: /memory/memory.json
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
      - mcp-memory-data:/memory
    command: ["8000", "node /mcp/node_modules/@modelcontextprotocol/server-memory/dist/index.js"]
    healthcheck:
      # node 镜像无 wget/curl; 用 node 起 TCP 连接探 8000(supergateway 监听)判存活。
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-think:
    image: mcp-gateway:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway.Dockerfile
    container_name: mcp-think
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
    # mcp_gateway <port> <stdio-command>；端口固定 8000，健康检查保持不变。
    command: ["8000", "node /mcp/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js"]
    healthcheck:
      # node 镜像无 wget/curl; 用 node 起 TCP 连接探 8000(supergateway 监听)判存活。
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  # fetch / git 原在 resolve-lume 的 deploy/mcp-bridges.compose.yml（手工 docker run 演化而来）。
  # 2026-11-09 收归 tsm-hub：五个 mcp-* 统一在这里，tsm-hub 是常驻网关，宿主重启后
  # 一条 `docker compose up -d` 全恢复，不再需要去 lume 仓另跑一套 compose。
  # 依赖也从 resolve-lume 的 vendored 目录合并到本仓 ./mcp/node_modules（单份，省 ~85MB）。
  mcp-fetch:
    image: mcp-gateway:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway.Dockerfile
    container_name: mcp-fetch
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
    command: ["8000", "node /mcp/node_modules/fetch-mcp-server.cjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-git:
    image: mcp-gateway-git:latest
    build:
      context: ./deploy
      dockerfile: mcp-gateway-git.Dockerfile
    container_name: mcp-git
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
      # git 要能 add/commit，必须 :rw；工作区路径由 tsm-hub/.env 的 WORKSPACE 注入。
      - ${WORKSPACE}:${WORKSPACE}:rw
    # 容器里没有 ~/.gitconfig，不显式给身份时 git_commit 直接报 Author identity unknown。
    environment:
      GIT_AUTHOR_NAME: Erishen
      GIT_AUTHOR_EMAIL: 3292057+erishen@users.noreply.github.com
      GIT_COMMITTER_NAME: Erishen
      GIT_COMMITTER_EMAIL: 3292057+erishen@users.noreply.github.com
    command: ["8000", "node /mcp/node_modules/@cyanheads/git-mcp-server/dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mcp-memory-data:
