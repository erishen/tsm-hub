services:
  tsm-hub:
    build: .
    image: tsm-hub:latest
    container_name: tsm-hub
    restart: unless-stopped
    ports:
      - "9070:9070"
    volumes:
      - ./data:/data
    environment:
      # 生产环境务必改成强口令；未设置时回落到 config.json 里的 admin_token。
      LLM_ROUTER_ADMIN_TOKEN: change-me-admin
      LLM_ROUTER_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9070/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
