services:
  tsm-hub:
    build: .
    image: tsm-hub:latest
    container_name: tsm-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:19070:9070"  # 仅本机回环可访问（外部端口 >10000），容器内仍监听 9070
    volumes:
      - ./data:/data
      # 技能库（gitmodules 子模块）只读挂载进容器，供技能注入/执行使用
      - ./skills:/skills:ro
    environment:
      # 生产环境务必改成强口令；未设置时回落到 config.json 里的 admin_token。
      # 如果想复用挂载的 ./data/config.json 中的 admin_token，注释掉下面这行即可
      # TSM_HUB_ADMIN_TOKEN: change-me-admin
      TSM_HUB_LOG_LEVEL: info
      # 智能路由策略（可选）：cost_first / stability_first / task_aware / balanced
      # TSM_HUB_SMART_STRATEGY: stability_first
      # TSM_HUB_SMART_COST_WEIGHT: 40
      # TSM_HUB_SMART_STABILITY_WEIGHT: 100
      # TSM_HUB_SMART_LATENCY_WEIGHT: 60
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9070/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # MCP stdio -> Streamable HTTP 桥接（deploy/mcp-bridge.Dockerfile，supergateway）。
  # tsm-hub 容器无 node/宿主路径，stdio 型 MCP 无法本地 spawn；改为把官方 stdio
  # server 包成 HTTP，tsm-hub config 里用 transport=http + url 远程调用。
  # fs 服务把宿主工作区挂到容器内同路径（:ro），路径通过 WORKSPACE 环境变量注入
  #（见 .env.example），避免把绝对路径写死进仓库；host==container 保持一致。
  mcp-fs:
    image: mcp-bridge:latest
    container_name: mcp-fs
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
      - ${WORKSPACE}:${WORKSPACE}:ro
    command: >
      --stdio "node /mcp/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js ${WORKSPACE}"
      --stateful --outputTransport streamableHttp --host 0.0.0.0 --port 8000

  mcp-memory:
    image: mcp-bridge:latest
    container_name: mcp-memory
    restart: unless-stopped
    environment:
      MEMORY_FILE_PATH: /memory/memory.json
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
      - mcp-memory-data:/memory
    command: >
      --stdio "node /mcp/node_modules/@modelcontextprotocol/server-memory/dist/index.js"
      --stateful --outputTransport streamableHttp --host 0.0.0.0 --port 8000

  mcp-think:
    image: mcp-bridge:latest
    container_name: mcp-think
    restart: unless-stopped
    volumes:
      - ./mcp/node_modules:/mcp/node_modules:ro
    command: >
      --stdio "node /mcp/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js"
      --stateful --outputTransport streamableHttp --host 0.0.0.0 --port 8000

volumes:
  mcp-memory-data:
