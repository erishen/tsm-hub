name: CI

# 把本机 `make check` 的七道门禁原样搬到干净的 Linux 环境，并自动触发。
# 本机另有 pre-commit hook，但 core.hooksPath 写在 .git/config、不随克隆分发，
# 所以协作/PR 场景必须由 CI 兜底。
#
# 不覆盖：make alert-check（需 11 个监控容器 + 运行中的 Prometheus 做 --live 解析），
#         仍在本机手动跑。coverage / vuln 两个 job 分别承担覆盖率下限与
#         可达漏洞门禁（VULN_STRICT=1，标准库告警同样拦截）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：只读代码，不写回仓库，不需要任何 secrets。
# 刻意不用 pull_request_target —— fork PR 自带的测试代码会在有权限的上下文里执行。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # go.mod 声明 go 1.26.11；用 go-version-file 而非硬编码，避免工具链漂移。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 三个门禁脚本用了 list[...] / re.Match[str] 注解，需要 Python >= 3.9。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fmt-check / test / vet / privacy-check / tree-privacy-check /
      # dashboard-check / web-lock-check。干净克隆里 privacy-check 会明确打印
      # SKIP（无 data/config.json），仓库面已由 tree-privacy-check 覆盖。
      - name: Local gates (make check)
        run: make check

      - name: Race regression
        run: make test-race

      # 验证 //go:embed 占位目录与外部链接产物在干净克隆里可构建。
      - name: Build server binary
        run: make build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 多阶段 Dockerfile 只编译 Go（前端产物由宿主预先构建），CI 里无需 Node/npm。
      # 实证 alpine/musl + CGO + external linkmode 与 //go:embed 占位目录能产出发布镜像。
      - name: Build release image
        run: docker build -t tsm-hub:ci .

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 干净克隆里 internal/web/dist/browser 只有 .gitkeep，前端产物相关用例会 SKIP，
      # 所以 COVER_MIN 按 CI 实测值留余量；本地可用 make cover-check COVER_MIN=... 覆写。
      # check-coverage.py 直接读 coverprofile，缺失/空/格式错误一律失败，不会静默通过。
      - name: Coverage floor
        run: make cover-check

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 固定 govulncheck 版本，避免 @latest 的供应链漂移。扫描器只访问 vuln.go.dev，
      # 请求里仅含「已知存在漏洞的模块路径」，不上传源码或私有依赖名。
      # go.mod 钉在 Go 1.26.11（已修掉此前 12 条标准库公告），VULN_STRICT=1
      # 让标准库告警同样硬失败；第三方依赖里被真实调用到的漏洞本来就是硬失败。
      - name: Reachable dependency vulnerabilities
        run: make vulncheck-gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govulncheck-report
          path: .data/govulncheck.json
          if-no-files-found: warn
