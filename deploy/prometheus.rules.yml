# tsm-hub 告警规则（由 deploy/prometheus.yml 的 rule_files 加载）
# 注意：HTTP/配额 counter 是纯内存累计，重启归零；上游 counter 由 health Tracker
# 维护且有 SQLite 快照恢复。所有规则一律用 rate()/increase()，不要用裸 counter 值。
# gauge 同理：latency_ms 是 EWMA，只在成功上报时更新、随 SQLite 快照恢复。
# health.go 已给 Latency()/Health()/Snapshot() 加 15 分钟惰性 TTL（过期导出 0），
# 判阈值前仍先用 increase() 确认近期确有成功样本，作为 TTL 之外的双保险。
groups:
  - name: tsm-hub
    rules:
      - alert: TSMHubDown
        expr: up{job="tsm-hub"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "tsm-hub 抓取失败"
          description: "Prometheus 已连续 2 分钟无法从 tsm-hub:9070/metrics 取到指标。检查容器与健康探针 /healthz。"

      - alert: TSMHubUpstreamErrorRateHigh
        # 低流量时 1~2 个请求失败就会算出 100% 错误率（2026-11-14 agnes 近 5m
        # 仅 2 次请求、2 次失败即进入 pending）。要求窗口内至少 5 次请求，
        # 避免把偶发单点失败当持续故障。
        expr: |
          (
            sum by (provider) (rate(tsm_hub_upstream_errors_total[5m]))
              / clamp_min(sum by (provider) (rate(tsm_hub_upstream_requests_total[5m])), 0.001) > 0.3
          )
          and on(provider)
          (sum by (provider) (increase(tsm_hub_upstream_requests_total[5m])) >= 5)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "上游 {{ $labels.provider }} 近 5 分钟错误率超过 30%"
          description: "常见于免费额度耗尽或上游限流；核对路由优先级与该 provider 的余额/额度，不要盲目把耗尽额度的 target 调回链首。"

      - alert: TSMHubProviderUnhealthy
        # 只告警「承接过流量但现在被摘除」的 provider，避免长期禁用的 bai/nvidia 等空跑告警。
        expr: tsm_hub_upstream_healthy == 0 and on(provider) tsm_hub_upstream_requests_total > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "上游 {{ $labels.provider }} 已被健康状态机摘除"
          description: "连续失败触发冷却/半开探测中。可在管理台 Providers 页查看失败原因与冷却到期时间。"

      - alert: TSMHubQuotaDenials
        expr: increase(tsm_hub_quota_denials_total[5m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "出现限流/额度拒绝（{{ $labels.code }}）"
          description: "近 5 分钟有请求被 RPM / token / 金额 / 每日额度挡下，核对 Key 配额配置。"

      - alert: TSMHubUpstreamLatencyHigh
        # tsm_hub_upstream_latency_ms 是 EWMA gauge，只在 ReportSuccess 时更新、
        # 失败不更新。health.go 已给 Latency/Snapshot 加 15m 惰性 TTL（过期导出 0），
        # 并让 SQLite 快照 Restore 回来的陈旧值立即过期。这里再叠加「近 15m 有
        # 成功样本」做防御性双保险：旧镜像、指标回填、Prometheus staleness 都
        # 不会让 2026-11-14 kimi 那种「10 天前的 58185ms」假告警重演。
        # 成功数 = 请求增量 - 错误增量（ReportSuccess 只 ++requests，失败两个都 ++）。
        expr: |
          (tsm_hub_upstream_latency_ms > 30000)
          and on(provider)
          (
            (
              sum by (provider) (increase(tsm_hub_upstream_requests_total[15m]))
              - sum by (provider) (increase(tsm_hub_upstream_errors_total[15m]))
            ) > 0
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "上游 {{ $labels.provider }} 近期成功请求延迟 EWMA 超过 30s"
          description: "近 15 分钟有成功样本且延迟 EWMA 持续 >30s，智能路由的延迟降权会生效。EWMA 有 15 分钟惰性 TTL，长期无成功请求的 provider 导出 0，不告警。"

      # ===== 通知链路自监控 =====
      # 自指告警的局限：Alertmanager / 钉钉桥挂掉时，这两条也送不出去。
      # 它们的价值是让 Grafana 面板与事后复盘能看到「通知什么时候断过」，
      # 并且在链路恢复后收到一条 resolved，确认通道重新打通。
      - alert: TSMHubAlertmanagerDown
        # absent() 覆盖「scrape job 被误删 / target 从未注册」的情况。
        expr: up{job="alertmanager"} == 0 or absent(up{job="alertmanager"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager 不可达，钉钉告警通知已中断"
          description: "检查 tsm-hub-alertmanager 容器与 /-/healthy；规则仍在 Prometheus 侧 firing，但不会送达群。"

      - alert: TSMHubDingtalkNotificationsFailing
        # 桥接器返回 5xx / 网络不通 / 钉钉 errcode!=0 时，Alertmanager 会累加失败计数。
        expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "近 10 分钟有钉钉通知投递失败"
          description: "核对 tsm-hub-dingtalk-bridge 日志（URL 已脱敏）；常见原因是加签密钥过期、群机器人被删或改了自定义关键词。"
