# tsm-hub 告警规则（由 deploy/prometheus.yml 的 rule_files 加载）
# 注意：HTTP/配额 counter 是纯内存累计，重启归零；上游 counter 由 health Tracker
# 维护且有 SQLite 快照恢复。所有规则一律用 rate()/increase()，不要用裸 counter 值。
# gauge 同理：latency_ms 是 EWMA，只在成功上报时更新、随 SQLite 快照恢复。
# health.go 已给 Latency()/Health()/Snapshot() 加 15 分钟惰性 TTL（过期导出 0），
# 判阈值前仍先用 increase() 确认近期确有成功样本，作为 TTL 之外的双保险。
# 2026-11-14 补充：upstream_error_classes_total 与两个 HTTP 直方图是纯内存
# counter，重启归零且不进 SQLite 快照，一律只用 increase()/rate()；
# 分类指标与 upstream_errors_total 同源（同一处 ++），只是多一个 class 维度。
groups:
  - name: tsm-hub
    rules:
      - alert: TSMHubDown
        expr: up{job="tsm-hub"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "tsm-hub 抓取失败"
          description: "Prometheus 已连续 2 分钟无法从 tsm-hub:9070/metrics 取到指标。检查容器与健康探针 /healthz。"

      - alert: TSMHubUpstreamErrorRateHigh
        # 低流量时 1~2 个请求失败就会算出 100% 错误率（2026-11-14 agnes 近 5m
        # 仅 2 次请求、2 次失败即进入 pending）。要求窗口内至少 5 次请求，
        # 避免把偶发单点失败当持续故障。
        expr: |
          (
            sum by (provider) (rate(tsm_hub_upstream_errors_total[5m]))
              / clamp_min(sum by (provider) (rate(tsm_hub_upstream_requests_total[5m])), 0.001) > 0.3
          )
          and on(provider)
          (sum by (provider) (increase(tsm_hub_upstream_requests_total[5m])) >= 5)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "上游 {{ $labels.provider }} 近 5 分钟错误率超过 30%"
          description: "常见于免费额度耗尽或上游限流；核对路由优先级与该 provider 的余额/额度，不要盲目把耗尽额度的 target 调回链首。"

      - alert: TSMHubProviderUnhealthy
        # 只告警「承接过流量但现在被摘除」的 provider，避免长期禁用的 bai/nvidia 等空跑告警。
        expr: tsm_hub_upstream_healthy == 0 and on(provider) tsm_hub_upstream_requests_total > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "上游 {{ $labels.provider }} 已被健康状态机摘除"
          description: "连续失败触发冷却/半开探测中。可在管理台 Providers 页查看失败原因与冷却到期时间。"

      - alert: TSMHubQuotaDenials
        expr: increase(tsm_hub_quota_denials_total[5m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "出现限流/额度拒绝（{{ $labels.code }}）"
          description: "近 5 分钟有请求被 RPM / token / 金额 / 每日额度挡下，核对 Key 配额配置。"

      - alert: TSMHubUpstreamLatencyHigh
        # tsm_hub_upstream_latency_ms 是 EWMA gauge，只在 ReportSuccess 时更新、
        # 失败不更新。health.go 已给 Latency/Snapshot 加 15m 惰性 TTL（过期导出 0），
        # 并让 SQLite 快照 Restore 回来的陈旧值立即过期。这里再叠加「近 15m 有
        # 成功样本」做防御性双保险：旧镜像、指标回填、Prometheus staleness 都
        # 不会让 2026-11-14 kimi 那种「10 天前的 58185ms」假告警重演。
        # 成功数 = 请求增量 - 错误增量（ReportSuccess 只 ++requests，失败两个都 ++）。
        expr: |
          (tsm_hub_upstream_latency_ms > 30000)
          and on(provider)
          (
            (
              sum by (provider) (increase(tsm_hub_upstream_requests_total[15m]))
              - sum by (provider) (increase(tsm_hub_upstream_errors_total[15m]))
            ) > 0
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "上游 {{ $labels.provider }} 近期成功请求延迟 EWMA 超过 30s"
          description: "近 15 分钟有成功样本且延迟 EWMA 持续 >30s，智能路由的延迟降权会生效。EWMA 有 15 分钟惰性 TTL，长期无成功请求的 provider 导出 0，不告警。"

      # 401/403 通常意味着 Key 失效、权限变更或被上游 WAF 拒绝，需要人去改配置。
      # 刻意不给 402（额度耗尽）/ 429（限流）设告警：免费池里这两种是常态，
      # 每天重复推群只会稀释真正要处理的告警；趋势看面板「上游失败类别」。
      - alert: TSMHubUpstreamAuthFailures
        expr: sum by (provider) (increase(tsm_hub_upstream_error_classes_total{class="auth"}[10m])) >= 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "上游 {{ $labels.provider }} 出现认证/权限失败"
          description: "近 10 分钟至少 2 次 401/403。核对 .env 里的 Key 是否过期或被改、provider 是否被 WAF 拦；402/429/5xx 请用 Grafana「上游失败类别」面板区分。"

      # 首字节（首次 Flush）才是流式请求用户真正感知的等待；总耗时直方图会把
      # 整个 SSE 生成过程算进去（可能几分钟），两者必须分开看。门控要求窗口内
      # 至少 5 次流式请求，避免低流量下 rate() 全 0 或单点慢请求造成假告警。
      - alert: TSMHubFirstByteSlow
        expr: |
          (
            histogram_quantile(0.95,
              sum by (le) (rate(tsm_hub_http_first_byte_seconds_bucket[10m]))) > 10
          )
          and
          (sum(increase(tsm_hub_http_first_byte_seconds_count[10m])) >= 5)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "流式请求首字节 p95 超过 10s"
          description: "近 10 分钟至少 5 次流式请求，首字节（首次 Flush）p95 >10s，多为上游排队或首 token 前等待。用 Grafana「首字节延迟」面板按 route 定位，别与总耗时 p95 混淆。"

      # ===== 通知链路自监控 =====
      # 自指告警的局限：Alertmanager / 钉钉桥挂掉时，这两条也送不出去。
      # 它们的价值是让 Grafana 面板与事后复盘能看到「通知什么时候断过」，
      # 并且在链路恢复后收到一条 resolved，确认通道重新打通。
      - alert: TSMHubAlertmanagerDown
        # absent() 覆盖「scrape job 被误删 / target 从未注册」的情况。
        expr: up{job="alertmanager"} == 0 or absent(up{job="alertmanager"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager 不可达，钉钉告警通知已中断"
          description: "检查 tsm-hub-alertmanager 容器与 /-/healthy；规则仍在 Prometheus 侧 firing，但不会送达群。"

      - alert: TSMHubDingtalkNotificationsFailing
        # 桥接器返回 5xx / 网络不通 / 钉钉 errcode!=0 时，Alertmanager 会累加失败计数。
        expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "近 10 分钟有钉钉通知投递失败"
          description: "核对 tsm-hub-dingtalk-bridge 日志（URL 已脱敏）；常见原因是加签密钥过期、群机器人被删或改了自定义关键词。"

      # ===== 黑盒探测（用户视角的存活面）=====
      # /metrics 抓取成功只说明 exporter 还能吐数据；/healthz 是绕过业务路由的
      # 独立存活面。上游 degraded=true 仍算探测成功（provider 级问题由
      # TSMHubProviderUnhealthy 负责），这里只判「整台网关是否应答」。
      - alert: TSMHubHealthzProbeFailed
        expr: probe_success{job="blackbox-healthz"} == 0 or absent(probe_success{job="blackbox-healthz"})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "tsm-hub /healthz 黑盒探测失败"
          description: "Prometheus 主动 GET /healthz 连续 3 分钟失败或返回非 status=ok。区别于 TSMHubDown（/metrics 抓取失败）；若同时触发，优先查容器是否存活。"

      - alert: TSMHubMCPBridgeProbeFailed
        expr: probe_success{job="blackbox-mcp"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MCP 桥 {{ $labels.mcp_server }} 的 /health 探测失败"
          description: "5 个 C 版 stdio→HTTP 桥之一无应答；该桥上的 MCP 工具会全部不可用。先核对 up{job=\"mcp-bridges\"} 与对应容器日志。"

      - alert: TSMHubBlackboxExporterDown
        # 探针自身挂掉会让上面两条同时失效，必须单独能发现。
        expr: up{job="blackbox-exporter"} == 0 or absent(up{job="blackbox-exporter"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "blackbox-exporter 不可达，黑盒探测已停摆"
          description: "此时 probe_success 全为 absent，不能据此判断目标健康。检查 tsm-hub-blackbox 容器与 deploy/blackbox.yml。"

  # ===== cicdkit（独立 compose 项目，经共享网络 cicd-monitor 抓取）=====
  # 注意：cicdkit 的 runs_total / probe_total / deploys_total 是「保留窗口级」
  # gauge（随 store trim 回落、重启归零），绝不能对其用裸值或 rate()。
  # 只有 build_seconds / deploy_seconds 是直方图，可安全用 histogram_quantile + rate。
  - name: cicdkit
    rules:
      - alert: CicdkitDown
        expr: up{job="cicdkit"} == 0 or absent(up{job="cicdkit"})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "cicdkit /metrics 抓取失败"
          description: "Prometheus 连续 3 分钟无法从 cicdkit:8080/metrics 取到指标（经共享网络 cicd-monitor）。检查 cicdkit 容器是否存活、是否已加入 cicd-monitor 网络（docker network inspect cicd-monitor）。"

      - alert: CicdkitBuildsSlow
        # p95 构建耗时 15 分钟持续 > 10 分钟。用直方图（而非窗口级 gauge）才能安全告警。
        expr: histogram_quantile(0.95, sum by (le) (rate(cicdkit_build_seconds_bucket[15m]))) > 600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cicdkit 构建 p95 耗时过高"
          description: "近 15 分钟构建耗时 p95 超过 10 分钟，可能是基础镜像拉取慢、构建上下文变大或宿主机资源紧张。结合 cicdkit 面板「构建耗时 p50/p95」确认。"
