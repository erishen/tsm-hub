# tsm-hub Prometheus 抓取配置（由 docker-compose.yml 挂载到 /etc/prometheus/prometheus.yml）
# 网关自己就是 exporter：internal/api/metrics.go 输出标准 text/plain; version=0.0.4。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: tsm-hub-local

rule_files:
  - /etc/prometheus/prometheus.rules.yml

# 告警只在这里汇聚，真正发通知由 Alertmanager 完成（分组/去重/抑制/恢复）。
# 用容器 DNS，不要写 127.0.0.1:19093 —— 那是 Prometheus 容器自己的 loopback。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 与 tsm-hub 同处 compose 默认网络，容器 DNS 名 tsm-hub 可解析（container_name 固定）。
  # 不要写 127.0.0.1:19070 —— 那是 Prometheus 容器自身的 loopback。
  # 也不要改绑 0.0.0.0 暴露 /metrics：该端点不鉴权，会泄露 provider 名与请求量。
  - job_name: tsm-hub
    metrics_path: /metrics
    scheme: http
    # /metrics 不鉴权。扩指标时先守住三条工程护栏，避免误把 key/URL/ID
    # 或高基数值写进标签，把未鉴权端点的暴露面连带放大。
    # 实测约 500 条序列（含 provider×8 个失败类别、按 flow 拆分的直方图）；
    # 5000 留足余量，超限时整个 scrape 失败而不是静默截断。
    sample_limit: 5000
    label_limit: 32
    label_value_length_limit: 128
    metric_relabel_configs:
      # 指标名白名单：网关指标一律 tsm_hub_ 前缀；up / scrape_* 是 Prometheus
      # 抓取元信息，必须保留，否则 TSMHubDown 规则会失去数据源。
      - source_labels: [__name__]
        regex: "^(up|scrape_.+|tsm_hub_.+)$"
        action: keep
    static_configs:
      - targets: ["tsm-hub:9070"]
        labels:
          service: tsm-hub
          env: local

  # Prometheus 自监控（up{job="prometheus"}、tsdb 状态等）
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Alertmanager 自监控：up{job="alertmanager"}、
  # alertmanager_notifications_total / _failed_total、alertmanager_alerts。
  # 通知链路本身故障时的自指告警只能靠 Grafana 看到（告警也发不出去），见规则文件。
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # ===== 5 个 C 版 MCP stdio→HTTP 桥（deploy/mcp_gateway.c 的 GET /metrics）=====
  # 桥不发布宿主端口，只能走 compose 默认网络的容器 DNS。mcp_server 是配置里
  # 写死的 5 个枚举值，不是从请求路径派生，不会造成标签基数膨胀。
  - job_name: mcp-bridges
    metrics_path: /metrics
    sample_limit: 1000
    label_limit: 16
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^(up|scrape_.+|mcp_gateway_.+)$"
        action: keep
    static_configs:
      - targets: ["mcp-fs:8000"]
        labels: { mcp_server: fs, service: mcp-gateway }
      - targets: ["mcp-memory:8000"]
        labels: { mcp_server: memory, service: mcp-gateway }
      - targets: ["mcp-think:8000"]
        labels: { mcp_server: think, service: mcp-gateway }
      - targets: ["mcp-fetch:8000"]
        labels: { mcp_server: fetch, service: mcp-gateway }
      - targets: ["mcp-git:8000"]
        labels: { mcp_server: git, service: mcp-gateway }

  # blackbox_exporter 自监控：probe_success=0 时必须能区分「探针挂了」还是
  # 「目标挂了」，否则告警无法定位。
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # 黑盒探测：从 Prometheus 视角主动 GET 存活端点。__param_target 只用于内部
  # 传参，instance 用配置里的短名，避免把完整 URL 写进时序标签。
  - job_name: blackbox-healthz
    metrics_path: /probe
    params:
      module: [http_healthz]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^(up|scrape_.+|probe_.+)$"
        action: keep
    static_configs:
      - targets: ["http://tsm-hub:9070/healthz"]
        labels: { probe_name: tsm-hub-healthz, service: tsm-hub }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe_name]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-mcp
    metrics_path: /probe
    params:
      module: [http_2xx]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^(up|scrape_.+|probe_.+)$"
        action: keep
    static_configs:
      - targets: ["http://mcp-fs:8000/health"]
        labels: { probe_name: mcp-fs, mcp_server: fs }
      - targets: ["http://mcp-memory:8000/health"]
        labels: { probe_name: mcp-memory, mcp_server: memory }
      - targets: ["http://mcp-think:8000/health"]
        labels: { probe_name: mcp-think, mcp_server: think }
      - targets: ["http://mcp-fetch:8000/health"]
        labels: { probe_name: mcp-fetch, mcp_server: fetch }
      - targets: ["http://mcp-git:8000/health"]
        labels: { probe_name: mcp-git, mcp_server: git }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe_name]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ===== cicdkit CI/CD 平台（独立 compose 项目，经共享网络 cicd-monitor 抓取）=====
  # cicdkit 服务容器名为 cicdkit，监听容器内 :8080（宿主只发布 127.0.0.1:10081，
  # 跨容器不走宿主端口）。两个项目都加入全局命名网络 cicd-monitor（见各自
  # docker-compose.yml 的 networks.cicd-monitor.name），容器 DNS 可解析 cicdkit。
  # 指标全部由 store 现场派生（cicdkit_/up），标签仅有限枚举，序列量恒定很小。
  - job_name: cicdkit
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["cicdkit:8080"]
        labels:
          service: cicdkit
          env: local
